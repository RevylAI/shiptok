name: Release

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: Build number for App Store Connect, higher than every build already uploaded for this version
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-to-app-store-connect:
    name: Archive and upload to App Store Connect
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Xcode
        run: bash scripts/revyl/remote-build.sh setup
      - name: Archive the Release build and upload it
        env:
          APP_BUILD_NUMBER: ${{ inputs.build-number }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: bash scripts/revyl/remote-build.sh upload-to-testflight
