project:
  id: 27d0b7f1-0a2f-4fa0-9466-697d3d5e818b
run_test_definitions_from_git: true
session:
  idle_timeout_seconds: 1800
  default_profile: signed-in
  profiles:
    signed-in:
      script: scripts/revyl/signed-in-session-profile.py
build:
  framework: ios
  profiles:
    development:
      ios:
        app_id: 48aec091-edd3-41d0-ae9c-34fb8822e5ca
        setup_commands:
          - bash scripts/revyl/remote-build.sh setup
        build_commands:
          - bash scripts/revyl/remote-build.sh compile
        output_path: build/DerivedData/Build/Products/Debug-iphonesimulator/ShipTok.app
        image: ios-macos-26-xcode-27.2
pr_review:
  enabled: true
  triggers:
    drafts: true
  build:
    kind: ci_upload_to_revyl
    app_ids:
      ios: 48aec091-edd3-41d0-ae9c-34fb8822e5ca
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    system_prompt: >-
      ShipTok is a native SwiftUI iOS app: a vertical, Reels-style feed of the
      open and merged pull requests with media in one GitHub repository.
      Nothing shows without a Revyl sign-in: the first screen offers only Sign
      in to Revyl and Join existing organization, and a Revyl sign-in without
      a connected GitHub account gets only the Connect GitHub screen. Prove
      changes signed in to Revyl as the ShipTok test account with the GitHub
      test account revyl-shiptok-tests connected, on the repository
      RevylAI/kyle-expo. A session you start with revyl device start runs this
      project's default session profile, signed-in, which opens ShipTok
      already signed in that way on RevylAI/kyle-expo's feed. Only if that
      start fails on the session profile, start the session again with
      --session-profile none and sign in: run the steps of
      .revyl/modules/shiptok-sign-in-as-test-account.yaml in order on the
      device with revyl device instruction and revyl device validation, typing
      the email, username and passwords through the variable references that
      file uses, never their values. For the GitHub authentication code, run
      revyl device code-execution --file .revyl/scripts/shiptok-github-totp-code.py
      --variable-name github-totp-code, then type '{{github-totp-code}}' into
      GitHub's Authentication code field. GitHub accepts each code once and the
      script waits for a fresh one, so a refused code gets one retry with a new
      run of the script. Never repeat a password or a code in a comment,
      report or log. Tap Authorize only if GitHub shows it, and choose
      RevylAI/kyle-expo if ShipTok asks for a repository. In the feed, swipe up
      for the next pull request and down for the previous one; a sideways swipe
      casts a vibe, a double-tap likes, and one tap pauses or resumes a video.
      The right rail holds like, comments, react, mute, playback speed, the
      media deck and More; the feed's tabs sit at the top and open on Merged.
      Weekly shows a video per week and Features a video per shipped feature;
      tapping one's title or deck button opens its pull requests, and a 'Week
      of' or 'Features' back button at the top left returns. A pull request with
      no media appears only in a feature's pull requests, as a card showing its
      state, stats, labels and description with a Details button. On the
      unfolded iPhone Duo a tab bar holds the feed, the inbox and Settings; on
      other phones and the folded Duo there is no tab bar, the inbox (a tray)
      and Settings (a gear) sit at the top right or at the top of the folded
      Duo's side strip, and each leads back with a Feed button at its top left.
      In Settings, Videos only (on by default) limits Open and Merged to pull
      requests that lead with a video. Likes, reactions, comments and vibes post
      to GitHub as revyl-shiptok-tests on RevylAI/kyle-expo, so undo every one
      before finishing: unlike, remove the reaction, delete the comment, and
      remove a vibe from its Your good vibes or Your bad vibes badge. Report on
      GitHub opens GitHub's report page in Safari; never submit it. Never tap
      Sign out, Delete my ShipTok data or Delete my Revyl account, and never
      submit a join request.
    always_verify:
      - ShipTok shows RevylAI/kyle-expo's feed on a pull request card, signed in as revyl-shiptok-tests
      - Settings shows @revyl-shiptok-tests and RevylAI/kyle-expo as the Repository
      - Every like, reaction, comment and vibe the proof posted to GitHub is undone before it finishes
  workflows:
    enabled: true
    workflow_ids:
      - a3b9d997-803e-4393-82b6-75613209013f
