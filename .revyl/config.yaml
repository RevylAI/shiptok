project:
  id: 27d0b7f1-0a2f-4fa0-9466-697d3d5e818b
run_test_definitions_from_git: true
session:
  idle_timeout_seconds: 1800
  default_profile: signed-in
  profiles:
    signed-in:
      script: scripts/revyl/signed-in-session-profile.py
build:
  framework: ios
  profiles:
    development:
      ios:
        app_id: 48aec091-edd3-41d0-ae9c-34fb8822e5ca
        setup_commands:
          - bash scripts/revyl/remote-build.sh setup
        build_commands:
          - bash scripts/revyl/remote-build.sh compile
        output_path: build/DerivedData/Build/Products/Debug-iphonesimulator/ShipTok.app
        image: ios-macos-26-xcode-27.2
pr_review:
  enabled: true
  triggers:
    drafts: true
  build:
    kind: ci_upload_to_revyl
    app_ids:
      ios: 48aec091-edd3-41d0-ae9c-34fb8822e5ca
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    system_prompt: >-
      ShipTok is a native SwiftUI iOS app: a vertical, Reels-style feed of the
      open and merged pull requests with media in one repository, served by
      Revyl's backend and signed in with a Revyl account. Prove changes signed
      in as Revyl's test account kyle+bench, in the Revyl Benchmarks
      organization, on the repository RevylAI/kyle-expo. A session you start
      with revyl device start runs this project's default session profile,
      signed-in, which opens ShipTok already signed in on RevylAI/kyle-expo's
      feed. Only if that start fails on the session profile, start the session
      again with --session-profile none --launch-var
      SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY --launch-var
      SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME, which signs the app in
      the same way. Never type or repeat a key, password or sign-in link. In the
      feed, swipe up for the next pull request and down for the previous one; a
      sideways swipe casts a vibe, a double-tap likes, and one tap pauses or
      resumes a video. The right rail holds like, comments, react, mute,
      playback speed, the media deck and More; the feed's tabs sit at the top.
      Weekly shows a video per week and Features a video per shipped feature;
      tapping one's title or deck button opens its pull requests, and a 'Week
      of' or 'Features' back button at the top left returns. A pull request with
      no media appears only in a feature's pull requests, as a card showing its
      state, stats, labels and description with a Details button. On the
      unfolded iPhone Duo a tab bar holds the feed, the inbox and Settings; on
      other phones and the folded Duo there is no tab bar, the inbox (a tray)
      and Settings (a gear) sit at the top right or at the top of the folded
      Duo's side strip, and each leads back with a Feed button at its top left.
      Stay on RevylAI/kyle-expo: never like, react, comment, reply or vibe on
      another repository's pull requests. Likes, reactions, comments, replies
      and vibes are saved on Revyl for the pull request's developer to see, so
      undo every one before finishing: unlike, remove the reaction, delete the
      comment or reply, and remove a vibe from its Your good vibes or Your bad
      vibes badge. Settings such as Videos only, Feed tabs and Vibe feedback
      are saved on Revyl for the account, so put back any you change. Report
      on a pull request opens GitHub's report page in Safari; never submit it.
      Never report a comment or vibe, and never submit Join existing
      organization. Never tap Sign out, since it revokes the key every session
      and test signs in with, and never tap Delete my Revyl account.
    always_verify:
      - ShipTok shows RevylAI/kyle-expo's feed on a pull request card, signed in as kyle+bench
      - Settings shows kyle+bench in Revyl Benchmarks and RevylAI/kyle-expo as the Repository
      - Every like, reaction, comment, reply, vibe and setting the proof changed is undone before it finishes
  workflows:
    enabled: true
    workflow_ids:
      - a3b9d997-803e-4393-82b6-75613209013f
