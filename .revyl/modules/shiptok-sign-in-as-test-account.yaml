# Signs in to Revyl as the ShipTok test account, connects the GitHub test account revyl-shiptok-tests and opens RevylAI/kyle-expo's feed.
# The code step writes into github-totp-code, which every test that imports this module keeps as a secret
# test variable in Revyl, so the code is masked in reports and logs.
# GitHub accepts each authentication code once, so a refused code is retried once with the next one.
blocks:
  - type: validation
    step_description: The first screen shows ShipTok with exactly two choices, a 'Sign in to Revyl' button and a 'Join existing organization' button
  - type: instructions
    step_description: Tap 'Sign in to Revyl'
  - type: validation
    step_description: A browser sheet opens over ShipTok on Revyl's sign-in page
  - type: instructions
    step_description: Sign in on Revyl's page with the email {{global.shiptok-revyl-sign-in-email}} and the password {{global.shiptok-revyl-sign-in-password}}, following the page's steps
  - type: validation
    step_description: Revyl's page asks to continue to ShipTok
  - type: instructions
    step_description: Tap 'Continue to ShipTok'
  - type: validation
    step_description: The browser sheet is gone and ShipTok shows its Connect GitHub screen, with the title 'Connect GitHub' and a 'Connect GitHub' button
  - type: instructions
    step_description: Tap the 'Connect GitHub' button
  - type: validation
    step_description: A browser sheet over ShipTok shows GitHub's sign-in page with a 'Username or email address' field and a 'Password' field
  - type: instructions
    step_description: Tap the 'Username or email address' field and type '{{global.shiptok-github-sign-in-username}}'
  - type: instructions
    step_description: Tap the 'Password' field and type '{{global.shiptok-github-sign-in-password}}'
  - type: instructions
    step_description: Tap the green 'Sign in' button below the password field
  - type: validation
    step_description: GitHub shows its two-factor authentication page, which asks for the authentication code from an authenticator app
  - type: code_execution
    script: shiptok-github-totp-code
    variable_name: github-totp-code
  - type: instructions
    step_description: Tap the 'Authentication code' field and type '{{github-totp-code}}'
  - type: manual
    step_type: wait
    step_description: "3"
  - type: if
    condition: GitHub still shows the two-factor authentication page with the code typed in and a 'Verify' button, and no error message
    then:
      - type: instructions
        step_description: Tap the 'Verify' button
      - type: manual
        step_type: wait
        step_description: "3"
  - type: if
    condition: GitHub shows its two-factor authentication page with an error saying the code failed, was already used or is too old
    then:
      - type: code_execution
        script: shiptok-github-totp-code
        variable_name: github-totp-code
      - type: instructions
        step_description: Tap the 'Authentication code' field, delete any digits in it, and type '{{github-totp-code}}'
      - type: manual
        step_type: wait
        step_description: "3"
  - type: if
    condition: GitHub still shows the two-factor authentication page with the code typed in and a 'Verify' button, and no error message
    then:
      - type: instructions
        step_description: Tap the 'Verify' button
  - type: if
    condition: GitHub shows a page asking to authorize the Revyl app, with an 'Authorize' button
    then:
      - type: instructions
        step_description: Tap the 'Authorize' button
  - type: manual
    step_type: wait
    step_description: "5"
  - type: if
    condition: ShipTok shows its 'Repository' list of repositories to choose from
    then:
      - type: instructions
        step_description: Tap the row that reads 'RevylAI/kyle-expo', the first item in the list just below the 'Search repositories' field
      - type: manual
        step_type: wait
        step_description: "5"
  - type: if
    condition: ShipTok shows 'Couldn't load merged PRs' with a 'Try again' button
    then:
      - type: instructions
        step_description: Tap 'Try again'
      - type: manual
        step_type: wait
        step_description: "5"
  - type: validation
    step_description: ShipTok shows its feed, not the first screen, the Connect GitHub screen or the Repository list - a pull request card with the author, title and pull request number at its lower left, the feed's tabs at the top and a rail of buttons down the right side
