blocks:
  - type: validation
    step_description: "The first screen shows ShipTok with exactly two choices, a 'Sign in to Revyl' button and a 'Join existing organization' button, and no other way in"
  - type: instructions
    step_description: "Tap 'Sign in to Revyl'"
  - type: validation
    step_description: "A browser sheet opens over ShipTok on Revyl's sign-in page"
  - type: instructions
    step_description: "Sign in on Revyl's page with the email {{global.shiptok-revyl-sign-in-email}} and the password {{global.shiptok-revyl-sign-in-password}}, following the page's steps"
  - type: validation
    step_description: "Revyl's page asks to continue to ShipTok"
  - type: instructions
    step_description: "Tap 'Continue to ShipTok'"
  - type: validation
    step_description: "The browser sheet is gone and the demo feed shows a pull request card: its video or image fills the card, the author and the pull request's title sit at the card's lower left, the Open / Merged / Weekly / Features switch sits at its top left with 'Merged' selected and a 'Connect GitHub' button under it, and a rail of buttons runs down its right side"
