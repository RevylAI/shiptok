test:
    metadata:
        name: shiptok-media-deck
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    env_vars:
        - SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY
        - SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME
    blocks:
        - type: validation
          step_description: 'ShipTok opens signed in on RevylAI/kyle-expo''s feed: a pull request card with the Open / Merged / Weekly / Features tabs at the top and a rail of buttons down the right side'
        - type: instructions
          step_description: Tap the media deck button on the right rail, the fanned stack of small cards with a count under it
        - type: validation
          step_description: The media deck opens full screen on a black background with a close button at its top left and a position label such as '1 of 4' at its top
        - type: instructions
          step_description: Swipe left across the full width of the media in one fast, long swipe, starting near the right edge of the screen at the middle of the media and ending near the left edge
        - type: validation
          step_description: The deck shows the next photo or video and its position label reads '2 of' the same total
        - type: instructions
          step_description: Tap the close button at the deck's top left
        - type: validation
          step_description: The deck is closed and the feed's pull request card shows again
