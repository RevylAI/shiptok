test:
    metadata:
        name: shiptok-feed-modes
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    env_vars:
        - SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY
        - SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME
    blocks:
        - type: validation
          step_description: 'ShipTok opens signed in on RevylAI/kyle-expo''s feed: a pull request card with the Open / Merged / Weekly / Features tabs at the top and a rail of buttons down the right side'
        - type: validation
          step_description: '''Merged'' is the selected tab in the Open / Merged / Weekly / Features tabs at the top of the feed, and the line under the pull request''s title reads ''#<number> · merged <when>'''
        - type: instructions
          step_description: Tap 'Open' in the tabs at the top of the feed
        - type: validation
          step_description: '''Open'' is the selected tab, and the card shows one of #112 ''ShipTok fixture: open PR with a video'', #113 ''ShipTok fixture: draft PR with a video'' and #141 ''ShipTok fixture: a pull request by someone else'' by revyl-dev-kylexrich-01; #113''s line under its title reads ''#113 · Draft · updated <when>'' and the others'' read ''#<number> · updated <when>'''
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: first-open-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: 'The card shows another one of #112 ''ShipTok fixture: open PR with a video'', #113 ''ShipTok fixture: draft PR with a video'' and #141 ''ShipTok fixture: a pull request by someone else'' by revyl-dev-kylexrich-01, not #{{first-open-pull-request-number}}'
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: second-open-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: 'The card shows the last one of #112 ''ShipTok fixture: open PR with a video'', #113 ''ShipTok fixture: draft PR with a video'' and #141 ''ShipTok fixture: a pull request by someone else'' by revyl-dev-kylexrich-01, neither #{{first-open-pull-request-number}} nor #{{second-open-pull-request-number}}'
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: The page says 'That's every open PR' and 'You've seen every open pull request in RevylAI/kyle-expo that leads with a video.'
        - type: instructions
          step_description: Tap 'Merged' in the tabs at the top
        - type: validation
          step_description: '''Merged'' is the selected tab and the card shows a pull request whose line under its title reads ''#<number> · merged <when>'''
