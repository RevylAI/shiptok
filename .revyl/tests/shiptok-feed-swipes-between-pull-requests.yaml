test:
    metadata:
        name: shiptok-feed-swipes-between-pull-requests
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    env_vars:
        - SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY
        - SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME
    blocks:
        - type: validation
          step_description: 'ShipTok opens signed in on RevylAI/kyle-expo''s feed: a pull request card with the Open / Merged / Weekly / Features tabs at the top and a rail of buttons down the right side'
        - type: extraction
          step_description: 'The pull request number on the card, shown after the title at its lower left, such as #126'
          variable_name: first-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: A different pull request card shows, whose number is not {{first-pull-request-number}}
        - type: extraction
          step_description: 'The pull request number on the card, shown after the title at its lower left, such as #126'
          variable_name: second-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: A third pull request card shows, whose number is neither {{first-pull-request-number}} nor {{second-pull-request-number}}
        - type: instructions
          step_description: Swipe down on the middle of the card
        - type: validation
          step_description: The card for pull request {{second-pull-request-number}} shows again
        - type: instructions
          step_description: Swipe down on the middle of the card
        - type: validation
          step_description: The card for pull request {{first-pull-request-number}} shows again
