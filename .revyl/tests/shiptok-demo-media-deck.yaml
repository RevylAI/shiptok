    blocks:
        - type: module_import
          step_description: Open the demo feed with Look around first
          module: shiptok-open-demo-feed
        - type: instructions
          step_description: Tap the media deck button on the right rail, the fanned stack of small cards with a count under it
        - type: validation
          step_description: The media deck opens full screen on a black background with a close button at its top left and a position label such as '1 of 3' at its top
