test:
    metadata:
        name: shiptok-settings
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    env_vars:
        - SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY
        - SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME
    blocks:
        - type: validation
          step_description: 'ShipTok opens signed in on RevylAI/kyle-expo''s feed: a pull request card with the Open / Merged / Weekly / Features tabs at the top and a rail of buttons down the right side'
        - type: instructions
          step_description: 'Tap Settings, the gear icon at the top right of the feed'
        - type: validation
          step_description: 'Settings shows an Account row with ''kyle+bench'', ''kyle+bench@revyl.ai'' and ''Signed in to Revyl in Revyl Benchmarks'', and a Feed section whose Repository is RevylAI/kyle-expo'
        - type: instructions
          step_description: 'Tap the Repository row in the Feed section'
        - type: validation
          step_description: 'A Repository list shows RevylAI/cognisim-monorepo, RevylAI/kyle-expo and RevylAI/shiptok-demo, with a checkmark beside RevylAI/kyle-expo'
        - type: instructions
          step_description: 'Tap the back button at the top left of the Repository list, without choosing a repository'
        - type: validation
          step_description: 'Settings shows again with RevylAI/kyle-expo as the Repository'
        - type: instructions
          step_description: 'Scroll down through Settings without tapping any toggle'
        - type: validation
          step_description: 'Settings shows a ''Feed tabs'' section with Open, Merged, Weekly and Features toggles, and a ''Vibe feedback'' section with ''Ask for feedback on good vibes'' and ''Ask for feedback on bad vibes'' toggles that says vibes and their feedback reach the pull request''s developer in ShipTok'
        - type: instructions
          step_description: 'Scroll down a little, until a ''Revyl Benchmarks'' section shows, without tapping any toggle'
        - type: validation
          step_description: 'Settings shows a ''Revyl Benchmarks'' section with a ''Feedback summary on GitHub'' toggle, and a ''Hidden people'' section'
        - type: instructions
          step_description: 'Scroll down to the bottom of Settings without tapping any button or toggle'
        - type: validation
          step_description: 'Settings shows a Gestures section explaining the swipes, taps and 2x speed, a ''Privacy and support'' section with ''Privacy policy'' and ''Contact support'', and ''Sign out'' and ''Delete my Revyl account'' buttons'
        - type: instructions
          step_description: 'Scroll back to the top of Settings and tap ''Feed'', the back button with a chevron at the top left, without tapping any other button'
        - type: validation
          step_description: 'The feed shows a pull request card again'
