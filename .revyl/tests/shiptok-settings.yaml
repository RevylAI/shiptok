        - type: instructions
          step_description: Scroll down through Settings
        - type: validation
          step_description: Settings shows a 'Vibe feedback' section with 'Ask for feedback on good vibes' turned off and 'Ask for feedback on bad vibes' turned on, and says every vibe posts to GitHub as a comment from you
        - type: instructions
          step_description: Scroll down to the bottom of Settings without tapping any button
        - type: validation
          step_description: Settings also shows 'Hidden people' saying no one is hidden, a Gestures section explaining the swipes, taps and 2x speed, a 'Privacy and support' section with 'Privacy policy' and 'Contact support', and the 'Sign out' and 'Delete my ShipTok data' buttons
        - type: instructions
          step_description: Scroll back to the top of Settings and tap 'Feed', the back button with a chevron at the top left, without tapping any other button
        - type: validation
