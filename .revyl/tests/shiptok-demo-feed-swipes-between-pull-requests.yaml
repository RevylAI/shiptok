test:
    metadata:
        name: shiptok-demo-feed-swipes-between-pull-requests
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    blocks:
        - type: module_import
          step_description: Sign in to Revyl with the test account and open the demo feed
          module: shiptok-sign-in-to-revyl-and-open-demo-feed
        - type: extraction
          step_description: The title of the pull request on the card
          variable_name: first-pull-request-title
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: A different pull request card shows, whose title is not '{{first-pull-request-title}}'
        - type: extraction
          step_description: The title of the pull request on the card
          variable_name: second-pull-request-title
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: A third pull request card shows, whose title is neither '{{first-pull-request-title}}' nor '{{second-pull-request-title}}'
        - type: instructions
          step_description: Swipe down on the middle of the card
        - type: validation
          step_description: The card for '{{second-pull-request-title}}' shows again
        - type: instructions
          step_description: Swipe down on the middle of the card
        - type: validation
          step_description: The card for '{{first-pull-request-title}}' shows again
