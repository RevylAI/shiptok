test:
    metadata:
        name: shiptok-pull-request-detail-sheet
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    env_vars:
        - SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY
        - SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME
    blocks:
        - type: validation
          step_description: 'ShipTok opens signed in on RevylAI/kyle-expo''s feed: a pull request card with the Open / Merged / Weekly / Features tabs at the top and a rail of buttons down the right side'
        - type: extraction
          step_description: The title of the pull request on the card
          variable_name: detailed-pull-request-title
        - type: instructions
          step_description: Tap the pull request's title at the card's lower left
        - type: validation
          step_description: A detail sheet opens with the title '{{detailed-pull-request-title}}', the author's GitHub login, when it was merged, the repository and pull request number with its added and removed line counts, an 'Open on GitHub' button and the pull request's description
        - type: instructions
          step_description: Tap 'Done' at the sheet's top right
        - type: validation
          step_description: The detail sheet is closed and the card for '{{detailed-pull-request-title}}' shows
