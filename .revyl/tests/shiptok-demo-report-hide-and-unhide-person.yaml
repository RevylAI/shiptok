test:
    metadata:
        name: shiptok-demo-report-hide-and-unhide-person
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    blocks:
        - type: module_import
          step_description: Sign in to Revyl with the test account and open the demo feed
          module: shiptok-sign-in-to-revyl-and-open-demo-feed
        - type: extraction
          step_description: The GitHub login of the pull request's author shown at the card's lower left
          variable_name: author-login
        - type: instructions
          step_description: Tap the More button, the three dots at the bottom of the right rail
        - type: validation
          step_description: A menu offers 'Report on GitHub' and 'Hide @{{author-login}}'
        - type: instructions
          step_description: Tap 'Report on GitHub'
        - type: validation
          step_description: A sheet titled 'Connect GitHub to report' offers 'Connect GitHub' and 'Not now'
        - type: instructions
          step_description: Tap 'Not now'
        - type: instructions
          step_description: Tap the More button on the right rail again, then tap 'Hide @{{author-login}}'
        - type: validation
          step_description: A confirmation asks to hide @{{author-login}}, saying their pull requests, weekly videos, comments, vibes and media won't show and that they can be unhidden in Settings
        - type: instructions
          step_description: Confirm by tapping 'Hide @{{author-login}}'
        - type: validation
          step_description: No pull request by {{author-login}} shows in the feed
        - type: instructions
          step_description: Tap the Settings tab, the person icon at the right of the tab bar at the bottom
        - type: validation
          step_description: Settings lists @{{author-login}} under 'Hidden people' with an 'Unhide' button
        - type: instructions
          step_description: Tap 'Unhide' next to @{{author-login}}
        - type: validation
          step_description: '''Hidden people'' says no one is hidden'
        - type: instructions
          step_description: Tap the Feed tab, the house icon at the left of the tab bar
        - type: validation
          step_description: The feed shows pull request cards again, including one by {{author-login}}
