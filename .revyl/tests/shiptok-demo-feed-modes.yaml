test:
    metadata:
        name: shiptok-demo-feed-modes
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    blocks:
        - type: module_import
          step_description: Open the demo feed with Look around first
          module: shiptok-open-demo-feed
        - type: validation
          step_description: '''Merged'' is the selected tab in the Open / Merged / Weekly / Features tabs at the top of the feed, and the line under the pull request''s title reads ''#<number> · merged <when>'', with a number from 1 to 5'
        - type: instructions
          step_description: Tap 'Open' in the tabs at the top of the feed
        - type: validation
          step_description: '''Open'' is the selected tab, and the card shows pull request #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'' or #8 ''Find rare bugs when a shopper searches for Rare''; #7''s line under its title reads ''#7 · updated <when>'' and #8''s reads ''#8 · Draft · updated <when>'''
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: first-open-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: 'The card shows the other one of #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'' and #8 ''Find rare bugs when a shopper searches for Rare'', not #{{first-open-pull-request-number}}; #7''s line under its title reads ''#7 · updated <when>'' and #8''s reads ''#8 · Draft · updated <when>'''
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: The page says 'That's every open PR' and 'You've seen every open pull request in this demo that leads with a video.'
        - type: instructions
          step_description: Tap 'Merged' in the tabs at the top
        - type: validation
          step_description: '''Merged'' is the selected tab and the card shows a pull request whose line under its title reads ''#<number> · merged <when>'', with a number from 1 to 5'
