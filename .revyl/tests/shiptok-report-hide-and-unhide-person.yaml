# Revyl Test Definition

_meta:
    remote_id: b21869b2-3ae8-466a-9c26-23d4ba9a4724
    remote_version: 6
    local_version: 6
    last_synced_at: "2026-11-24T15:45:08Z"
    checksum: 80b3872768c412c69655ff15f0b82e91fb2b059a253dfbc5cd680bf184325f95
test:
    metadata:
        name: shiptok-report-hide-and-unhide-person
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    env_vars:
        - SHIPTOK_LAUNCH_SIGN_IN_REVYL_API_KEY
        - SHIPTOK_LAUNCH_SIGN_IN_FEED_REPOSITORY_FULL_NAME
    blocks:
        - type: validation
          step_description: 'ShipTok opens signed in on RevylAI/kyle-expo''s feed: a pull request card with the Open / Merged / Weekly / Features tabs at the top and a rail of buttons down the right side'
        - type: instructions
          step_description: Tap 'Open' in the tabs at the top of the feed
        - type: instructions
          step_description: If the card's author at its lower left isn't revyl-dev-kylexrich-01, swipe up on the middle of the card until the card by revyl-dev-kylexrich-01 shows. Swipe only up or down, never right or left, since a right or left swipe casts a vibe.
        - type: validation
          step_description: '''Open'' is the selected tab and the card''s author at its lower left is revyl-dev-kylexrich-01, with or without a [bot] suffix'
        - type: extraction
          step_description: The GitHub username of the pull request's author shown at the card's lower left
          variable_name: author-username
        - type: instructions
          step_description: Tap the More button, the three dots at the bottom of the right rail
        - type: validation
          step_description: A menu has a 'Pull request by @{{author-username}}' section offering 'Report on GitHub' and 'Hide @{{author-username}}'
        - type: instructions
          step_description: Tap 'Report on GitHub'
        - type: manual
          step_type: wait
          step_description: "3"
        - type: validation
          step_description: Safari shows a github.com page for reporting content, or GitHub's sign-in page in front of it, and ShipTok is no longer on screen
        - type: manual
          step_type: open_app
        - type: manual
          step_type: wait
          step_description: "3"
        - type: instructions
          step_description: If 'Open' isn't the selected tab at the top of the feed, tap 'Open'. Then, if the card by {{author-username}} isn't showing, swipe up or down on the middle of the card until it shows. Swipe only up or down, never right or left.
        - type: validation
          step_description: ShipTok's Open tab shows the card by {{author-username}}
        - type: instructions
          step_description: Tap the More button on the right rail, then tap 'Hide @{{author-username}}'
        - type: validation
          step_description: A confirmation titled 'Hide @{{author-username}}?' says their pull requests, weekly and feature videos won't show in ShipTok on this iPhone, that they aren't told and nothing changes on GitHub, and that they can be unhidden anytime in Settings
        - type: instructions
          step_description: Confirm by tapping 'Hide @{{author-username}}'
        - type: validation
          step_description: The Open tab shows a pull request by someone other than {{author-username}}, or says every open pull request has been seen, and no card by {{author-username}} shows
        - type: instructions
          step_description: Tap Settings, the gear icon at the top right of the feed
        - type: validation
          step_description: Settings lists @{{author-username}} under 'Hidden people' with an 'Unhide' button
        - type: instructions
          step_description: Tap 'Unhide' next to @{{author-username}}
        - type: validation
          step_description: '''Hidden people'' says no one is hidden'
        - type: instructions
          step_description: Tap 'Feed', the back button with a chevron at the top left of Settings
        - type: instructions
          step_description: If 'Open' isn't the selected tab at the top of the feed, tap 'Open'. Then, if the card by {{author-username}} isn't showing, swipe up or down on the middle of the card until it shows. Swipe only up or down, never right or left.
        - type: validation
          step_description: The Open tab shows the card by {{author-username}} again
