test:
    metadata:
        name: shiptok-demo-videos-only-setting
        platform: ios
    build:
        name: ShipTok
    device:
        model: iPhone 17 Pro Max
        os_version: iOS 27.0
        orientation: portrait
    blocks:
        - type: module_import
          step_description: Open the demo feed with Look around first
          module: shiptok-open-demo-feed
        - type: instructions
          step_description: Tap Settings, the gear icon at the top right of the feed
        - type: validation
          step_description: Settings shows a Feed section with the Repository RevylAI/shiptok-demo and a 'Videos only' toggle that is on, with a note that Open and Merged show only pull requests that lead with a video
        - type: instructions
          step_description: Tap the 'Videos only' toggle
        - type: validation
          step_description: The 'Videos only' toggle is off
        - type: instructions
          step_description: Tap 'Feed', the back button with a chevron at the top left of Settings
        - type: validation
          step_description: The demo feed shows a pull request card with 'Merged' the selected tab at the top
        - type: instructions
          step_description: Tap 'Open' in the tabs at the top of the feed
        - type: validation
          step_description: '''Open'' is the selected tab, and the card shows pull request #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'', #8 ''Find rare bugs when a shopper searches for Rare'' or #9 ''Give each tab in the bottom bar its own icon'''
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: first-open-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: 'The card shows another one of #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'', #8 ''Find rare bugs when a shopper searches for Rare'' and #9 ''Give each tab in the bottom bar its own icon'', not #{{first-open-pull-request-number}}'
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: second-open-pull-request-number
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: 'The card shows the one of #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'', #8 ''Find rare bugs when a shopper searches for Rare'' and #9 ''Give each tab in the bottom bar its own icon'' that is neither #{{first-open-pull-request-number}} nor #{{second-open-pull-request-number}}'
        - type: instructions
          step_description: Swipe up on the middle of the card
        - type: validation
          step_description: The page says 'That's every open PR' and 'You've seen every open pull request in this demo with a video, screenshot or GIF.'
        - type: instructions
          step_description: Tap Settings, the gear icon at the top right of the feed, again
        - type: validation
          step_description: The 'Videos only' toggle is still off
        - type: instructions
          step_description: Tap the 'Videos only' toggle
        - type: validation
          step_description: The 'Videos only' toggle is on
        - type: instructions
          step_description: Tap 'Feed' at the top left of Settings
        - type: validation
          step_description: '''Open'' is the selected tab, and the page says ''That''s every open PR'' and ''You''ve seen every open pull request in this demo that leads with a video.'''
        - type: instructions
          step_description: Swipe down on the middle of the page
        - type: validation
          step_description: 'The card shows pull request #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'' or #8 ''Find rare bugs when a shopper searches for Rare'', not #9 ''Give each tab in the bottom bar its own icon'''
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: last-open-pull-request-number
        - type: instructions
          step_description: Swipe down on the middle of the card
        - type: validation
          step_description: 'The card shows the other one of #7 ''Add the Orchid Mantis to the cart, not a Gold Tortoise'' and #8 ''Find rare bugs when a shopper searches for Rare'', not #{{last-open-pull-request-number}} and not #9 ''Give each tab in the bottom bar its own icon'''
        - type: extraction
          step_description: The pull request number after '#' in the line under the card's title, digits only
          variable_name: first-open-pull-request-number-with-videos-only
        - type: instructions
          step_description: Swipe down on the middle of the card
        - type: validation
          step_description: 'The card for #{{first-open-pull-request-number-with-videos-only}} still shows, since it is Open''s first card, and no card for #9 ''Give each tab in the bottom bar its own icon'' has appeared'
